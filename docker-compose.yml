services:
  hdhr-dvr-manager:
    build: .
    container_name: hdhr-dvr-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data          # stores your per-show keep limits (limits.json)
    environment:
      DVR_HOST: "192.168.1.130"
      # Your timezone, so the daily run happens when you expect:
      TZ: "America/Chicago"
      # Run the keep-limit cleanup once a day at this local time (HH:MM, 24h). Empty = manual only.
      AUTO_PRUNE_TIME: "03:00"
      # Safety cap: if an automatic run would delete more than this many recordings,
      # it skips and waits for you to review and click "Apply keep limits".
      AUTO_PRUNE_MAX: "25"
      # Optional: point straight at the record engine's JSON instead of DVR_HOST:
      # DVR_STORAGE_URL: "http://192.168.1.130:PORT/recorded_files.json"
      # Optional basic auth:
      # APP_USER: "admin"
      # APP_PASS: "change-me"
