services:
  hdhr-dvr-manager:
    build: .
    container_name: hdhr-dvr-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data          # your keep limits and settings (limits.json, settings.json); not committed to git
    environment: {}
      # Set your DVR's address in the app's Settings tab. Optionally give it a first-run default here:
      # DVR_HOST: "192.168.1.50"
      # The DVR must be on a private network (10.x, 172.16-31.x, 192.168.x). To allow another range,
      # for example Tailscale, list it here:
      # DVR_ALLOWED_NETWORKS: "100.64.0.0/10"
      # Optional basic auth:
      # APP_USER: "admin"
      # APP_PASS: "change-me"
