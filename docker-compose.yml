services:
  hdhr-dvr-manager:
    build: .
    container_name: hdhr-dvr-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data          # stores your keep limits and settings (limits.json, settings.json)
    environment:
      # First-run default for the DVR address. You can change it later in the app's Settings tab.
      DVR_HOST: "192.168.1.130"
      # The daily cleanup schedule, timezone and safety cap are set in the app's Settings tab.
      # Optional basic auth:
      # APP_USER: "admin"
      # APP_PASS: "change-me"
