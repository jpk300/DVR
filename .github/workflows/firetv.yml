name: Fire TV app

# Builds the Fire TV APK. On the firetv branch it is also published as the "firetv-latest"
# pre-release, so it can be downloaded on the Fire TV itself from a fixed address:
#   https://github.com/<owner>/<repo>/releases/download/firetv-latest/dvr-manager-firetv.apk
on:
  push:
    branches: [firetv]
    paths: ["firetv/**", ".github/workflows/firetv.yml"]
  pull_request:
    paths: ["firetv/**", ".github/workflows/firetv.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to publish the release

# One run per branch at a time: two pushes close together would otherwise both delete and re-create
# firetv-latest at once, and one fails. A newer push waits for the running build, then publishes last.
# Pull requests cancel their older run instead, since they don't publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: "8.10.2"

      # Optional: sign with your own key so new builds install over old ones (see firetv/README.md).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FIRETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FIRETV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository's release key"
          else
            echo "No signing key set: building a debug APK"
          fi

      - name: Build
        working-directory: firetv/android
        env:
          FIRETV_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
          FIRETV_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
          FIRETV_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
        run: |
          if [ -n "${FIRETV_KEYSTORE_FILE:-}" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dvr-manager-firetv.apk"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dvr-manager-firetv.apk"
          fi
          ls -l "$RUNNER_TEMP/dvr-manager-firetv.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dvr-manager-firetv
          path: ${{ runner.temp }}/dvr-manager-firetv.apk

      - name: Publish as the firetv-latest pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/firetv'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firetv-latest --yes --cleanup-tag || true
          gh release create firetv-latest "$RUNNER_TEMP/dvr-manager-firetv.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Fire TV app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on the firetv branch (run ${GITHUB_RUN_NUMBER}). Install instructions: firetv/README.md"
