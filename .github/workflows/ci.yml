name: CI

on:
  push:
    branches: [main, firetv]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt ruff==0.8.4
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        env:
          DVR_SCHEDULER: "0"
        run: python -m unittest discover -s tests -v
      - name: App starts
        env:
          DVR_SCHEDULER: "0"
        run: |
          DATA_DIR="$(mktemp -d)" python - <<'EOF'
          from app import app
          c = app.test_client()
          for path in ("/", "/api/settings", "/api/limits", "/api/history", "/api/timezones"):
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code)
          print("ok")
          EOF

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (JSDoc via TypeScript)
        run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build image
        run: docker build -t dvr-manager-ci .
